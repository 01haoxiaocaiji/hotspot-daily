name: daily-hotspot

on:
  schedule:
    # 北京时间每天 08:00（GitHub 用 UTC，故为 00:00 UTC）
    - cron: '0 0 * * *'
  workflow_dispatch:        # 手动触发，方便先测试

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取热点并发送邮件
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python hotspot.py --send --out-dir out

      - name: 保存当日日报（可在 Actions 运行记录里下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotspot-brief
          path: out/
          retention-days: 7
